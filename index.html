<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copilot Agent</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      /* 애플 스타일 오로라 그라데이션 배경 */
      background: linear-gradient(135deg, #1d1d1f 0%, #2b2b36 40%, #171c28 100%);
    }

    /* 배경 장식용 리퀴드 블러 오랑주/퍼플 오라 */
    .bg-glow-1 {
      position: absolute;
      width: 500px;
      height: 500px;
      top: -100px;
      left: -100px;
      background: radial-gradient(circle, rgba(120, 119, 198, 0.35) 0%, rgba(255, 255, 255, 0) 70%);
      filter: blur(80px);
      z-index: 0;
      pointer-events: none;
    }

    .bg-glow-2 {
      position: absolute;
      width: 600px;
      height: 600px;
      bottom: -150px;
      right: -100px;
      background: radial-gradient(circle, rgba(68, 160, 255, 0.25) 0%, rgba(255, 255, 255, 0) 70%);
      filter: blur(100px);
      z-index: 0;
      pointer-events: none;
    }

    /* 리퀴드 글래스 프레임 컨테이너 */
    .glass-container {
      position: relative;
      z-index: 1;
      width: 90vw;
      max-width: 1200px;
      height: 88vh;
      
      /* Glassmorphism 핵심 - 불투명 배경 & 강한 Blur 효과 */
      background: rgba(255, 255, 255, 0.07);
      -webkit-backdrop-filter: blur(30px) saturate(200%);
      backdrop-filter: blur(30px) saturate(200%);
      
      /* 라운딩 및 빛 반사 효과 라인 */
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 
        0 30px 60px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
        
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    /* 애플 매킨토시 헤더 타이틀바 */
    .glass-header {
      height: 48px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 18px;
      position: relative;
    }

    /* 창 조절 신호등 버튼 */
    .window-buttons {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      opacity: 0.85;
    }

    .dot-close { background-color: #ff5f56; border: 0.5px solid rgba(0, 0, 0, 0.2); }
    .dot-minimize { background-color: #ffbd2e; border: 0.5px solid rgba(0, 0, 0, 0.2); }
    .dot-maximize { background-color: #27c93f; border: 0.5px solid rgba(0, 0, 0, 0.2); }

    .header-title {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      font-weight: 500;
      letter-spacing: -0.2px;
    }

    /* iframe 영역 */
    .chat-iframe {
      width: 100%;
      height: calc(100% - 48px);
      border: none;
      background: transparent;
    }
  </style>
</head>
<body>

  <!-- 배경 빛 조명 효과 -->
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <!-- 리퀴드 글래스 창 -->
  <div class="glass-container">
    <div class="glass-header">
      <div class="window-buttons">
        <span class="dot dot-close"></span>
        <span class="dot dot-minimize"></span>
